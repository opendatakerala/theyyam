<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add a Theyyam Event – Theyyam Calendar Project | തെയ്യം കലണ്ടർ</title>
<meta name="description" content="Theyyam Calendar Project – an open data initiative to map Theyyam, the socio-religious ritual and integral cultural symbol of North Malabar. By Sahya Digital Conservation Foundation.">
<meta property="og:title" content="Theyyam Calendar Project">
<meta property="og:description" content="An open data initiative to map Theyyam, the socio-religious ritual and integral cultural symbol of North Malabar.">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wdth,wght@75..125,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --kumkum:#A3141C;      /* deep vermilion red of the Theyyam face */
  --kumkum-dark:#6E0B10;
  --manjal:#E9A80E;      /* turmeric yellow */
  --ola:#C9B26A;         /* tender palm leaf (kuruthola) */
  --ari:#FFFBF2;         /* rice-paste white */
  --ink:#1E1512;
  --muted:#6B5C55;
  --line:#E4D8C8;
  --ok:#2E6B3A;
  --err:#B3261E;
  --radius:10px;
  font-family:"Anek Malayalam","Noto Sans Malayalam","Nirmala UI",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ari);color:var(--ink);font-size:17px;line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom,0px)}

/* ---------- Header with palm-leaf fringe ---------- */
header{background:var(--kumkum);color:#fff;position:relative;
  padding:calc(28px + env(safe-area-inset-top,0px)) 20px 44px}
header::after{ /* kuruthola fringe */
  content:"";position:absolute;left:0;right:0;bottom:-18px;height:20px;
  background:
    linear-gradient(135deg,var(--manjal) 50%,transparent 50%) 0 0/20px 20px repeat-x,
    linear-gradient(225deg,var(--manjal) 50%,transparent 50%) 0 0/20px 20px repeat-x;
}
.head-inner{max-width:780px;margin:0 auto;display:flex;gap:18px;align-items:center}
.logo{width:76px;height:76px;flex:none;background:var(--ari);border-radius:50%;
  padding:8px;border:3px solid var(--manjal)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo a{display:block;width:100%;height:100%}
.logo{padding:3px}
.back{display:inline-block;margin-bottom:14px;font-weight:600;color:var(--kumkum);text-decoration:none}
.back:hover{text-decoration:underline}
details.tool{margin-top:40px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
details.tool summary{cursor:pointer;font-weight:700;color:var(--kumkum-dark)}
header h1{margin:0;font-stretch:115%;font-weight:750;font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.1}
header p{margin:.35rem 0 0;color:#FFE7B3;font-size:.98rem}
header .tagline{color:#fff;font-size:1.02rem;max-width:56ch;margin-top:.6rem;line-height:1.4}
header .tagline-ml{color:#FFE7B3;font-size:.92rem;max-width:56ch;margin-top:.2rem;line-height:1.5}
header .org{margin-top:.6rem;font-weight:600;color:var(--manjal);font-size:.9rem}
@media(max-width:520px){.head-inner{align-items:flex-start}.logo{width:60px;height:60px}}

main{max-width:780px;margin:0 auto;padding:44px 16px 40px}
.intro{color:var(--muted);margin:0 0 24px}
.req{color:var(--kumkum);font-weight:700}

/* ---------- Sections ---------- */
fieldset{border:0;margin:0 0 28px;padding:0 0 0 16px;border-left:4px solid var(--kumkum)}
legend{font-weight:700;font-size:1.25rem;font-stretch:110%;padding:0;margin-bottom:12px;color:var(--kumkum-dark)}
legend small{display:block;font-weight:400;font-size:.9rem;color:var(--muted);font-stretch:100%}

.grid{display:grid;gap:14px}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}

label{display:block;font-weight:600;font-size:.95rem;margin-bottom:4px}
label .ml{font-weight:400;color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted);margin-top:3px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);
  background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--kumkum);box-shadow:0 0 0 3px rgba(163,20,28,.15)}
.invalid{border-color:var(--err)!important;background:#FFF5F4}
.err{color:var(--err);font-size:.82rem;margin-top:3px;display:none}
.show{display:block}

.inline{display:flex;gap:8px}
.inline input{flex:1}

/* ---------- Image drop ---------- */
.drop{border:2px dashed var(--ola);border-radius:var(--radius);background:#fff;padding:18px;
  display:flex;gap:16px;align-items:center;cursor:pointer;position:relative}
.drop:focus-within{border-color:var(--kumkum)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.drop .thumb{width:84px;height:84px;border-radius:8px;background:var(--ari) center/cover no-repeat;
  flex:none;display:grid;place-items:center;color:var(--ola);font-size:2rem;border:1px solid var(--line)}
.drop .txt{font-size:.95rem}
.drop .txt strong{display:block}
.rename{font-size:.85rem;margin-top:6px;color:var(--ok);word-break:break-all}

/* ---------- Buttons ---------- */
button{font:inherit;cursor:pointer;border-radius:8px;min-height:44px;padding:9px 16px;font-weight:600}
.btn{background:var(--kumkum);color:#fff;border:0}
.btn:hover{background:var(--kumkum-dark)}
.btn-ghost{background:#fff;color:var(--kumkum);border:1.5px solid var(--kumkum)}
.btn-ghost:hover{background:#FFF1EF}
.btn-sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn-x{background:transparent;border:0;color:var(--muted);min-height:38px;padding:4px 10px;font-size:.88rem}
.btn-x:hover{color:var(--err)}
button:focus-visible{outline:3px solid var(--manjal);outline-offset:2px}

/* ---------- Date blocks ---------- */
.date-block{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.date-head{display:flex;align-items:end;gap:10px;padding:12px 14px;background:#FFF4DA;border-bottom:1px solid var(--line)}
.date-head .f{flex:1}
.date-head .num{font-weight:750;font-size:1.4rem;color:var(--kumkum);font-stretch:120%;padding-bottom:6px}
.entries{padding:6px 14px 12px}
.entry{display:grid;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.entry:last-of-type{border-bottom:0}
@media(min-width:700px){
  .entry{grid-template-columns:110px 1.3fr 1fr 1fr auto;align-items:end}
  .entry .rm{align-self:end}
}
.entry label{font-size:.82rem}
.entry-tools{padding:0 14px 14px}

/* ---------- Actions / output ---------- */
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.status{margin-top:16px;padding:12px 14px;border-radius:8px;display:none;font-size:.95rem}
.status.ok{display:block;background:#EAF4EC;color:var(--ok);border:1px solid #BFDCC5}
.status.bad{display:block;background:#FDECEA;color:var(--err);border:1px solid #F3C2BD}
.status.wait{display:block;background:#FFF4DA;color:#7A5600;border:1px solid #F0D98E}
#output{display:none;margin-top:22px}
#output pre{background:var(--ink);color:#F4E7C8;padding:14px;border-radius:8px;overflow:auto;
  font-size:.82rem;max-height:340px;white-space:pre}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:20px 16px 32px}
footer a{color:var(--kumkum)}
@media (prefers-reduced-motion:no-preference){.date-block,.entry{animation:in .25s ease-out}}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.lang-switch{display:flex;justify-content:flex-end;max-width:780px;margin:-10px auto 14px}
.lang-switch button{border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;
  padding:5px 14px;min-height:36px;font-size:.9rem;font-weight:600;border-radius:0}
.lang-switch button:first-child{border-radius:99px 0 0 99px}
.lang-switch button:last-child{border-radius:0 99px 99px 0;border-left:0}
.lang-switch button[aria-pressed="true"]{background:var(--manjal);border-color:var(--manjal);color:var(--ink)}
</style>
</head>
<body data-title-key="page_title_submit">

<header>
  <div class="lang-switch" role="group" data-i18n-aria="lang_label">
    <button type="button" data-setlang="en" lang="en">English</button>
    <button type="button" data-setlang="ml" lang="ml">മലയാളം</button>
  </div>
  <div class="head-inner">
    <div class="logo"><a href="index.html"><img src="assets/logo.png" alt="Theyyam Calendar Project – home"></a></div>
    <div>
      <h1 data-i18n="site_title">Theyyam Calendar Project</h1>
      <p class="tagline" data-i18n="tagline"></p>
      <p class="org" data-i18n="org"></p>
    </div>
  </div>
</header>

<main>
  <a class="back" href="index.html" data-i18n="back_link"></a>
  <p class="intro" data-i18n-html="intro"></p>

  <form id="tform" novalidate>

    <!-- IMAGE -->
    <fieldset>
      <legend data-i18n="legend_poster"></legend>
      <div class="grid">
        <div>
          <label for="image"><span data-i18n="label_image"></span> <span class="req">*</span></label>
          <div class="drop" id="drop">
            <div class="thumb" id="thumb">◈</div>
            <div class="txt"><strong id="imgName" data-i18n="tap_choose"></strong><span class="hint" data-i18n="img_types"></span></div>
            <input type="file" id="image" accept="image/*">
          </div>
          <div class="err" id="e-image" data-i18n="err_image"></div>
        </div>
        <div>
          <label for="filename"><span data-i18n="label_filename"></span> <span class="req">*</span></label>
          <input id="filename" placeholder="Theyyam20260001" autocomplete="off">
          <div class="hint" data-i18n="hint_filename"></div>
          <div class="rename" id="renamePreview"></div>
          <div class="err" id="e-filename" data-i18n="err_filename"></div>
        </div>
      </div>
    </fieldset>

    <!-- KAVU -->
    <fieldset>
      <legend data-i18n="legend_kavu"></legend>
      <div class="grid g2">
        <div>
          <label for="kavuEn"><span data-i18n="label_kavu_en"></span> <span class="req">*</span></label>
          <input id="kavuEn" lang="en" placeholder="Muchilot Bhagavathi Kavu">
          <div class="err" id="e-kavuEn" data-i18n="err_kavu_en"></div>
        </div>
        <div>
          <label for="kavuMl"><span data-i18n="label_kavu_ml"></span> <span class="req">*</span></label>
          <input id="kavuMl" lang="ml" placeholder="മുച്ചിലോട്ട് ഭഗവതി കാവ്">
          <div class="err" id="e-kavuMl" data-i18n="err_kavu_ml"></div>
        </div>
      </div>
      <div class="grid" style="margin-top:14px">
        <div>
          <label for="otherNames" data-i18n="label_other"></label>
          <input id="otherNames" data-i18n-ph="ph_other">
        </div>
        <div>
          <label for="kavuQid" data-i18n="label_qid"></label>
          <div class="inline">
            <input id="kavuQid" placeholder="Q12345678" autocapitalize="characters">
            <button type="button" class="btn-ghost btn-sm" id="fetchQid" data-i18n="fetch"></button>
          </div>
          <div class="hint" data-i18n="hint_fetch"></div>
          <div class="err" id="e-kavuQid" data-i18n="err_qid"></div>
        </div>
      </div>
      <div class="grid g3" style="margin-top:14px">
        <div>
          <label for="lat" data-i18n="label_lat"></label>
          <input id="lat" inputmode="decimal" placeholder="12.1234">
          <div class="err" id="e-lat" data-i18n="err_lat"></div>
        </div>
        <div>
          <label for="lon" data-i18n="label_lon"></label>
          <input id="lon" inputmode="decimal" placeholder="75.2345">
          <div class="err" id="e-lon" data-i18n="err_lon"></div>
        </div>
        <div>
          <label>&nbsp;</label>
          <button type="button" class="btn-ghost" id="geoBtn" style="width:100%" data-i18n="use_location"></button>
        </div>
      </div>
      <div style="margin-top:14px">
        <label for="place" data-i18n="label_place"></label>
        <input id="place" placeholder="Kayyur, Kasaragod">
      </div>
      <div style="margin-top:14px">
        <label for="note" data-i18n="label_note"></label>
        <textarea id="note" maxlength="500" rows="3" data-i18n-ph="ph_note"></textarea>
        <div class="hint"><span id="noteCount">0</span>/500 <span data-i18n="note_hint"></span></div>
      </div>
    </fieldset>

    <!-- CALENDAR -->
    <fieldset>
      <legend data-i18n="legend_dates"></legend>
      <div id="dates"></div>
      <div class="err" id="e-dates" data-i18n="err_dates"></div>
      <button type="button" class="btn-ghost" id="addDate" data-i18n="add_date"></button>
    </fieldset>

    <div class="actions">
      <button type="submit" class="btn" id="sendBtn" data-i18n="send"></button>
      <button type="button" class="btn-ghost" id="previewBtn" data-i18n="preview"></button>
      <button type="button" class="btn-x" id="resetBtn" data-i18n="clear"></button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div id="output">
      <pre id="jsonOut"></pre>
      <div class="actions">
        <button type="button" class="btn-ghost btn-sm" id="dlJson" data-i18n="dl_json"></button>
        <button type="button" class="btn-ghost btn-sm" id="dlImg" data-i18n="dl_img"></button>
        <button type="button" class="btn-ghost btn-sm" id="shareBtn" data-i18n="share"></button>
      </div>
    </div>
  </form>

  <!-- hidden transport for email delivery -->
  <iframe name="sendFrame" id="sendFrame" style="display:none" title="send"></iframe>

  <details class="tool">
    <summary data-i18n="tool_summary"></summary>
    <p class="hint" style="font-size:.92rem" data-i18n-html="tool_hint"></p>
    <input type="file" id="mergeFiles" accept=".json,.geojson,application/json" multiple>
    <div class="actions"><button type="button" class="btn" id="mergeBtn" data-i18n="tool_btn"></button></div>
    <div class="status" id="mergeStatus"></div>
  </details>
</main>

<footer>
  <a href="index.html" data-i18n="site_title"></a> · <span data-i18n-html="footer_submit"></span><br>
  <span data-i18n="org"></span>
</footer>

<datalist id="ritualList">
  <option value="Thottam (തോറ്റം)">
  <option value="Vellattam (വെള്ളാട്ടം)">
  <option value="Theyyam / Purappad (പുറപ്പാട്)">
  <option value="Kodiyettam (കൊടിയേറ്റം)">
  <option value="Kalasam (കലശം)">
  <option value="Kalasattam (കലശാട്ടം)">
  <option value="Mudiyeduppu (മുടിയെടുപ്പ്)">
  <option value="Perumkaliyattam (പെരുങ്കളിയാട്ടം)">
  <option value="Kaliyattam (കളിയാട്ടം)">
</datalist>

  function setLang(l) {
    if (l !== "en" && l !== "ml") return;
    lang = l;
    try { localStorage.setItem(STORE_KEY, l); } catch (e) {}
    apply(document);
    document.dispatchEvent(new CustomEvent("langchange", { detail: { lang } }));
  }

  /* ---------- formatting helpers ---------- */
  const locale = () => (lang === "ml" ? "ml-IN" : "en-IN");
  function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function fmtDate(s) {
    return parseISO(s).toLocaleDateString(locale(), { weekday: "short", day: "numeric", month: "long", year: "numeric" });
  }
  function fmtTime(t) {
    if (!t) return "—";
    const [h, m] = t.split(":").map(Number);
    if (lang === "ml") {
      /* the way Theyyam notices write time: പുലർച്ചെ 4:00, രാത്രി 9:00 */
      const part = h < 3 ? "രാത്രി" : h < 6 ? "പുലർച്ചെ" : h < 12 ? "രാവിലെ" : h < 15 ? "ഉച്ചയ്ക്ക്" : h < 19 ? "വൈകുന്നേരം" : "രാത്രി";
      return `${part} ${(h % 12) || 12}:${String(m).padStart(2, "0")}`;
    }
    return new Date(2000, 0, 1, h, m).toLocaleTimeString(locale(), { hour: "numeric", minute: "2-digit" });
  }
  function monthYear(y, m) { return new Date(y, m, 1).toLocaleDateString(locale(), { month: "long", year: "numeric" }); }
  function weekdays() {
    return [...Array(7)].map((_, i) => new Date(2023, 0, 1 + i) /* 1 Jan 2023 is a Sunday */.toLocaleDateString(locale(), { weekday: "short" }));
  }
  /* "Thottam (തോറ്റം)" → "Thottam" in English, "തോറ്റം" in Malayalam */
  function ritual(r) {
    if (!r) return "";
    const m = String(r).match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    if (!m) return r;
    return lang === "ml" ? m[2] : m[1];
  }
  function plural(n, one, many) { return n === 1 ? t(one) : t(many); }

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-setlang]");
    if (b) { e.preventDefault(); setLang(b.dataset.setlang); }
  });
  document.addEventListener("DOMContentLoaded", () => apply(document));

  window.I18N = { t, apply, setLang, get lang() { return lang; }, locale, fmtDate, fmtTime, monthYear, weekdays, ritual, plural };
})();

</script>
<script>
/* =========================================================
   CONFIGURATION
   Entries are emailed to RECIPIENT_EMAIL with the subject
   "<File Name> - Theyyam Map Project", with the JSON file and the
   renamed photo attached. Delivery uses FormSubmit (formsubmit.co). The very first
   submission sends an activation email to this address –
   click the link in it once, and later entries arrive directly.
   ========================================================= */
const RECIPIENT_EMAIL = "manoj@sahya.org.in";
const PROJECT_NAME = "Theyyam Calendar Project";
const EMAIL_SUBJECT_SUFFIX = "Theyyam Map Project";

const $ = id => document.getElementById(id);
const { t } = I18N;
I18N.apply();
let imageFile = null;
let lastPayload = null;

/* ---------- helpers ---------- */
function cleanName(s){
  return s.trim().replace(/[\\/:*?"<>|#\[\]{}]/g,"").replace(/\s+/g,"_").replace(/_+/g,"_");
}
function extOf(file){
  const m = file.name.match(/\.([a-z0-9]+)$/i);
  if (m) return m[1].toLowerCase();
  return (file.type.split("/")[1] || "jpg").replace("jpeg","jpg");
}
function renamedImage(){
  if (!imageFile) return null;
  const base = cleanName($("filename").value);
  if (!base) return null;
  return new File([imageFile], `${base}.${extOf(imageFile)}`, {type: imageFile.type});
}
function updateRenamePreview(){
  const f = renamedImage();
  $("renamePreview").textContent = f ? t("rename_preview",{f:f.name}) : "";
}
function setErr(id, on){
  const el = $(id), e = $("e-"+id);
  if (el) el.classList.toggle("invalid", on);
  if (e) e.classList.toggle("show", on);
  return on;
}
const qidOk = v => !v || /^Q\d+$/.test(v);
function status(msg, kind){ const s=$("status"); s.className="status "+kind; s.textContent=msg; }

/* ---------- image ---------- */
$("image").addEventListener("change", e => {
  imageFile = e.target.files[0] || null;
  if (imageFile){
    $("thumb").style.backgroundImage = `url(${URL.createObjectURL(imageFile)})`;
    $("thumb").textContent = "";
    $("imgName").textContent = imageFile.name;
    if (!$("filename").value) $("filename").value = imageFile.name.replace(/\.[^.]+$/,"");
    setErr("image", false);
  }
  updateRenamePreview();
});
$("filename").addEventListener("input", updateRenamePreview);
$("note").addEventListener("input", e => { $("noteCount").textContent = e.target.value.length; });
$("kavuQid").addEventListener("input", e => { e.target.value = e.target.value.toUpperCase().trim(); });

/* ---------- geolocation ---------- */
$("geoBtn").addEventListener("click", () => {
  if (!navigator.geolocation) return status(t("st_no_geo"), "bad");
  $("geoBtn").textContent = t("locating");
  navigator.geolocation.getCurrentPosition(p => {
    $("lat").value = p.coords.latitude.toFixed(6);
    $("lon").value = p.coords.longitude.toFixed(6);
    $("geoBtn").textContent = t("use_location");
  }, () => {
    $("geoBtn").textContent = t("use_location");
    status(t("st_geo_denied"), "bad");
  }, {enableHighAccuracy:true, timeout:15000});
});

/* ---------- Wikidata fetch ---------- */
async function wdEntity(ids){
  const url = `https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${ids}&props=labels|claims|aliases&languages=en|ml&format=json&origin=*`;
  const r = await fetch(url); return (await r.json()).entities || {};
}
$("fetchQid").addEventListener("click", async () => {
  const q = $("kavuQid").value;
  if (!q || setErr("kavuQid", !qidOk(q))) return;
  $("fetchQid").textContent = "…";
  try{
    const ent = (await wdEntity(q))[q];
    if (!ent || ent.missing !== undefined) throw new Error("Item not found");
    const L = ent.labels || {};
    if (!$("kavuEn").value && L.en) $("kavuEn").value = L.en.value;
    if (!$("kavuMl").value && L.ml) $("kavuMl").value = L.ml.value;
    const al = [...(ent.aliases?.en||[]), ...(ent.aliases?.ml||[])].map(a=>a.value);
    if (!$("otherNames").value && al.length) $("otherNames").value = al.join(", ");
    const c = ent.claims?.P625?.[0]?.mainsnak?.datavalue?.value;
    if (c && !$("lat").value){ $("lat").value = c.latitude; $("lon").value = c.longitude; }
    const loc = ent.claims?.P131?.[0]?.mainsnak?.datavalue?.value?.id;
    if (loc && !$("place").value){
      const le = (await wdEntity(loc))[loc];
      $("place").value = le?.labels?.en?.value || le?.labels?.ml?.value || "";
    }
    status(t("st_fetched",{q}), "ok");
  }catch(err){ status(t("st_fetch_fail",{q, e:err.message}), "bad"); }
  $("fetchQid").textContent = t("fetch");
});

/* ---------- dynamic dates & entries ---------- */
function entryHTML(){
  return `
    <div><label data-i18n="label_time"></label><input type="time" class="e-time"></div>
    <div><label data-i18n="label_theyyam"></label><input class="e-theyyam" placeholder="Muchilot Bhagavathi"></div>
    <div><label data-i18n="label_ritual"></label><input class="e-ritual" list="ritualList" data-i18n-ph="ph_ritual"></div>
    <div><label data-i18n="label_qid"></label><input class="e-qid" placeholder="Q…" autocapitalize="characters"></div>
    <button type="button" class="btn-x rm" data-i18n="remove" data-i18n-aria="remove_entry"></button>`;
}
function addEntry(container){
  const d = document.createElement("div");
  d.className = "entry"; d.innerHTML = entryHTML(); I18N.apply(d);
  d.querySelector(".rm").onclick = () => {
    if (container.querySelectorAll(".entry").length > 1) d.remove();
    else d.querySelectorAll("input").forEach(i => i.value = "");
  };
  d.querySelector(".e-qid").addEventListener("input", e => e.target.value = e.target.value.toUpperCase().trim());
  container.appendChild(d);
}
function renumber(){
  document.querySelectorAll(".date-block").forEach((b,i) => b.querySelector(".num").textContent = i+1);
}
function addDate(){
  const b = document.createElement("div");
  b.className = "date-block";
  b.innerHTML = `
    <div class="date-head">
      <span class="num"></span>
      <div class="f"><label><span data-i18n="label_date"></span> <span class="req">*</span></label>
        <input type="date" class="d-date"></div>
      <button type="button" class="btn-x d-rm" data-i18n="remove_date"></button>
    </div>
    <div class="entries"></div>
    <div class="entry-tools"><button type="button" class="btn-ghost btn-sm add-e" data-i18n="add_entry"></button></div>`;
  I18N.apply(b);
  const entries = b.querySelector(".entries");
  addEntry(entries);
  b.querySelector(".add-e").onclick = () => addEntry(entries);
  b.querySelector(".d-rm").onclick = () => {
    if (document.querySelectorAll(".date-block").length > 1){ b.remove(); renumber(); }
  };
  $("dates").appendChild(b);
  renumber();
}
$("addDate").addEventListener("click", addDate);
addDate();

/* ---------- validation ---------- */
function validate(){
  let bad = false;
  bad = setErr("image", !imageFile) || bad;
  bad = setErr("filename", !cleanName($("filename").value)) || bad;
  bad = setErr("kavuEn", !$("kavuEn").value.trim()) || bad;
  bad = setErr("kavuMl", !$("kavuMl").value.trim()) || bad;
  bad = setErr("kavuQid", !qidOk($("kavuQid").value)) || bad;
  const lat = $("lat").value.trim(), lon = $("lon").value.trim();
  bad = setErr("lat", lat !== "" && (isNaN(lat) || Math.abs(lat) > 90)) || bad;
  bad = setErr("lon", lon !== "" && (isNaN(lon) || Math.abs(lon) > 180)) || bad;

  let anyDate = false;
  document.querySelectorAll(".d-date").forEach(d => {
    const miss = !d.value; d.classList.toggle("invalid", miss);
    if (miss) bad = true; else anyDate = true;
  });
  $("e-dates").classList.toggle("show", !anyDate);
  document.querySelectorAll(".e-qid").forEach(q => {
    const w = !qidOk(q.value); q.classList.toggle("invalid", w); if (w) bad = true;
  });
  if (bad){
    const first = document.querySelector(".invalid, .err.show");
    first?.scrollIntoView({behavior:"smooth", block:"center"});
  }
  return !bad;
}

/* ---------- build JSON ---------- */
function buildPayload(){
  const img = renamedImage();
  const lat = $("lat").value.trim(), lon = $("lon").value.trim();
  const calendar = [...document.querySelectorAll(".date-block")].map(b => ({
    date: b.querySelector(".d-date").value,
    entries: [...b.querySelectorAll(".entry")].map(e => ({
      time: e.querySelector(".e-time").value || null,
      theyyam: e.querySelector(".e-theyyam").value.trim() || null,
      ritual_type: e.querySelector(".e-ritual").value.trim() || null,
      wikidata: e.querySelector(".e-qid").value.trim() || null
    })).filter(x => x.time || x.theyyam || x.ritual_type || x.wikidata)
  }));
  return {
    project: PROJECT_NAME,
    organization: "Sahya Digital Conservation Foundation",
    submitted_at: new Date().toISOString(),
    image: { file_name: img?.name || null, original_name: imageFile?.name || null,
             mime_type: imageFile?.type || null, size_bytes: imageFile?.size || null },
    kavu: {
      name_en: $("kavuEn").value.trim(),
      name_ml: $("kavuMl").value.trim(),
      other_names: $("otherNames").value.split(",").map(s=>s.trim()).filter(Boolean),
      wikidata: $("kavuQid").value.trim() || null,
      coordinates: (lat && lon) ? { lat: parseFloat(lat), lon: parseFloat(lon) } : null,
      place: $("place").value.trim() || null,
      note: $("note").value.trim() || null
    },
    calendar
  };
}
function jsonFile(p){
  const base = cleanName($("filename").value) || "theyyam_entry";
  return new File([JSON.stringify(p, null, 2)], `${base}.json`, {type:"application/json"});
}
function showOutput(p){
  $("jsonOut").textContent = JSON.stringify(p, null, 2);
  $("output").style.display = "block";
}
function download(file){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- send by email (FormSubmit, multipart with attachments) ---------- */
function sendEmail(p){
  const jf = jsonFile(p), img = renamedImage();
  const f = document.createElement("form");
  f.action = `https://formsubmit.co/${RECIPIENT_EMAIL}`;
  f.method = "POST"; f.enctype = "multipart/form-data"; f.target = "sendFrame";
  f.style.display = "none";
  const add = (name, value) => {
    const i = document.createElement("input"); i.type = "hidden"; i.name = name; i.value = value; f.appendChild(i);
  };
  add("_subject", `${cleanName($("filename").value)} - ${EMAIL_SUBJECT_SUFFIX}`);
  add("_captcha", "false");
  add("_template", "box");
  add("Kavu", `${p.kavu.name_en} (${p.kavu.name_ml})`);
  add("Dates", p.calendar.map(c => c.date).join(", "));
  add("JSON", JSON.stringify(p, null, 2));

  const attach = (name, file) => {
    try{
      const dt = new DataTransfer(); dt.items.add(file);
      const i = document.createElement("input"); i.type = "file"; i.name = name; i.files = dt.files;
      f.appendChild(i); return true;
    }catch(e){ return false; }
  };
  const okJ = attach("attachment_json", jf);
  const okI = img ? attach("attachment_image", img) : false;

  document.body.appendChild(f);
  status(t("st_sending"), "wait");
  $("sendBtn").disabled = true;
  $("sendFrame").onload = () => {
    $("sendBtn").disabled = false;
    status(okJ && okI ? t("st_sent_both") : t("st_sent_json"), "ok");
    $("sendFrame").onload = null;
  };
  f.submit(); f.remove();
}

/* ---------- events ---------- */
$("tform").addEventListener("submit", e => {
  e.preventDefault();
  if (!validate()){ status(t("st_missing"), "bad"); return; }
  lastPayload = buildPayload();
  showOutput(lastPayload);
  sendEmail(lastPayload);
});
$("previewBtn").addEventListener("click", () => { lastPayload = buildPayload(); showOutput(lastPayload); });
$("dlJson").addEventListener("click", () => download(jsonFile(lastPayload || buildPayload())));
$("dlImg").addEventListener("click", () => {
  const img = renamedImage();
  img ? download(img) : status(t("st_choose_img"), "bad");
});
$("shareBtn").addEventListener("click", async () => {
  const p = lastPayload || buildPayload();
  const files = [jsonFile(p)]; const img = renamedImage(); if (img) files.push(img);
  if (navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({ files, title: `${cleanName($("filename").value)} - ${EMAIL_SUBJECT_SUFFIX}`,
         text: `Theyyam Calendar entry for ${p.kavu.name_en} (${p.kavu.name_ml})` }); }
    catch(e){ /* user cancelled */ }
  } else {
    const body = encodeURIComponent(JSON.stringify(p, null, 2));
    location.href = `mailto:${RECIPIENT_EMAIL}?subject=${encodeURIComponent(cleanName($("filename").value)+" - "+EMAIL_SUBJECT_SUFFIX)}&body=${body}`;
  }
});
$("resetBtn").addEventListener("click", () => {
  if (!confirm(t("confirm_clear"))) return;
  $("tform").reset(); imageFile = null; lastPayload = null;
  $("thumb").style.backgroundImage = ""; $("thumb").textContent = "◈";
  $("imgName").textContent = t("tap_choose"); $("renamePreview").textContent = "";
  $("dates").innerHTML = ""; addDate(); $("noteCount").textContent = "0";
  $("output").style.display = "none"; $("status").className = "status";
  document.querySelectorAll(".invalid").forEach(x => x.classList.remove("invalid"));
  document.querySelectorAll(".err.show").forEach(x => x.classList.remove("show"));
});

/* ---------- maintainer tool: merge submissions into GeoJSON ---------- */
function slug(s){ return String(s||"").toLowerCase().normalize("NFKD").replace(/[^\w\u0D00-\u0D7F]+/g,"-").replace(/^-|-$/g,""); }
$("mergeBtn").addEventListener("click", async () => {
  const files = [...$("mergeFiles").files];
  const ms = $("mergeStatus");
  if (!files.length){ ms.className="status bad"; ms.textContent=t("merge_none"); return; }
  const byKey = new Map(); let added = 0, skipped = [];
  const keyOf = p => p.wikidata ? p.wikidata : "name:" + slug(p.name_en);
  const mergeInto = (p, coords) => {
    const key = keyOf(p);
    if (!byKey.has(key)) byKey.set(key, {type:"Feature", geometry: coords ? {type:"Point", coordinates: coords} : null,
      properties: {...p, id: p.id || (p.wikidata || slug(p.name_en)), calendar: []}});
    const f = byKey.get(key);
    if (!f.geometry && coords) f.geometry = {type:"Point", coordinates: coords};
    ["name_ml","place","image","wikidata","note"].forEach(k => { if (!f.properties[k] && p[k]) f.properties[k] = p[k]; });
    f.properties.other_names = [...new Set([...(f.properties.other_names||[]), ...(p.other_names||[])])];
    (p.calendar || []).forEach(d => {
      let day = f.properties.calendar.find(x => x.date === d.date);
      if (!day){ day = {date: d.date, entries: []}; f.properties.calendar.push(day); }
      (d.entries || []).forEach(e => {
        const sig = JSON.stringify([e.time, e.theyyam, e.ritual_type]);
        if (!day.entries.some(x => JSON.stringify([x.time, x.theyyam, x.ritual_type]) === sig)) day.entries.push(e);
      });
    });
    f.properties.calendar.sort((a,b) => a.date.localeCompare(b.date));
    added++;
  };
  for (const file of files){
    try{
      const j = JSON.parse(await file.text());
      if (j.type === "FeatureCollection"){
        (j.features||[]).forEach(ft => { if (!ft.properties?.sample) mergeInto(ft.properties||{}, ft.geometry?.coordinates || null); });
      } else if (j.kavu){
        const c = j.kavu.coordinates;
        mergeInto({...j.kavu, image: j.image?.file_name || null, calendar: j.calendar || [], submitted_at: j.submitted_at},
                  c ? [c.lon, c.lat] : null);
      } else skipped.push(file.name);
    }catch(e){ skipped.push(file.name); }
  }
  const fc = {type:"FeatureCollection", name:"Theyyam Calendar Project", generated_at:new Date().toISOString(), features:[...byKey.values()]};
  download(new File([JSON.stringify(fc, null, 2)], "theyyam.geojson", {type:"application/geo+json"}));
  const noLoc = fc.features.filter(f => !f.geometry).length;
  ms.className = "status ok";
  ms.textContent = t("merge_built",{k:fc.features.length, r:added}) +
    (noLoc ? t("merge_noloc",{n:noLoc}) : "") +
    (skipped.length ? t("merge_skipped",{f:skipped.join(", ")}) : "");
});

/* ---------- language change: refresh text set from code ---------- */
document.addEventListener("langchange", () => {
  updateRenamePreview();
  if (imageFile) $("imgName").textContent = imageFile.name;
});
</script>
</body>
